name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach binaries to and re-publish to npm (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge (rebase) on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh pr list --label "autorelease: pending" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --rebase || echo "auto-merge could not be enabled (branch protection may be missing)"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: release-please
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            bun-target: bun-linux-arm64
          - target: darwin-x64
            os: macos-latest
            bun-target: bun-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64
          - target: windows-x64
            os: ubuntu-latest
            bun-target: bun-windows-x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            ext=".exe"
          fi
          bun build src/index.ts \
            --compile \
            --target=${{ matrix.bun-target }} \
            --outfile=dist/hs-${{ matrix.target }}${ext} \
            --minify

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hs-${{ matrix.target }}
          path: dist/hs-${{ matrix.target }}*
          retention-days: 7

  attach-binaries:
    name: attach binaries to release
    needs: [release-please, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist-binaries
          merge-multiple: true

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" dist-binaries/hs-* --clobber

  publish-npm:
    name: publish to npm
    needs: release-please
    if: |
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publisher (OIDC) requires npm CLI >= 11.5.1. Node 24 ships an
      # 11.x npm but not necessarily >= 11.5.1, so pin to the latest explicitly.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm (Trusted Publisher / OIDC)
        run: npm publish --provenance --access public

  update-homebrew-tap:
    name: bump homebrew tap
    needs: [release-please, attach-binaries]
    if: |
      always() &&
      needs.attach-binaries.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v6
        with:
          repository: say8425/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap

      - name: Render formula
        env:
          VERSION_RAW: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          # strip leading "v" from tag
          VERSION="${VERSION_RAW#v}"
          echo "version=$VERSION"
          BASE_URL="https://github.com/say8425/hs-cli/releases/download/v${VERSION}"

          declare -A SHA
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            curl -fsSL -o "/tmp/hs-$t" "$BASE_URL/hs-$t"
            SHA[$t]=$(sha256sum "/tmp/hs-$t" | awk '{print $1}')
            echo "$t: ${SHA[$t]}"
          done

          cat > tap/Formula/hs-cli.rb <<RB
          class HsCli < Formula
            desc "Hearthstone CLI for AI agents and humans — decode decks, look up cards, query metadata"
            homepage "https://github.com/say8425/hs-cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/hs-darwin-arm64"
                sha256 "${SHA[darwin-arm64]}"
              end
              on_intel do
                url "${BASE_URL}/hs-darwin-x64"
                sha256 "${SHA[darwin-x64]}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/hs-linux-arm64"
                sha256 "${SHA[linux-arm64]}"
              end
              on_intel do
                url "${BASE_URL}/hs-linux-x64"
                sha256 "${SHA[linux-x64]}"
              end
            end

            def install
              binary = Dir["hs-*"].first
              bin.install binary => "hs"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/hs --version")
            end
          end
          RB

      - name: Commit and push
        env:
          VERSION_RAW: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          cd tap
          VERSION="${VERSION_RAW#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/hs-cli.rb; then
            echo "Formula unchanged. Skipping commit."
            exit 0
          fi
          git add Formula/hs-cli.rb
          git commit -m "feat: bump hs-cli to ${VERSION}"
          git push
